<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MB-A Maths Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single reading column (max 860px) under a sticky top bar; graph-paper band behind the hero. */
:root {
  --paper: #f5f7fb;
  --card: #ffffff;
  --ink: #141b2d;
  --muted: #5a6479;
  --line: #dde3ee;
  --grid: #e7ecf5;
  --accent: #2a52c9;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebfb;
  --accent-2: #c2410c;
  --mark: #ffe680;
  --good: #16794d;
  --good-soft: #e1f4ea;
  --bad: #b3261e;
  --bad-soft: #fbe7e5;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141e; --card: #161d2b; --ink: #e5e9f2; --muted: #9aa5ba; --line: #283246; --grid: #1a2232;
    --accent: #86a6ff; --accent-ink: #0b1020; --accent-soft: #1d2743; --accent-2: #fb923c; --mark: #6b5713;
    --good: #5fd39a; --good-soft: #12301f; --bad: #ff8a80; --bad-soft: #3a1a18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141e; --card: #161d2b; --ink: #e5e9f2; --muted: #9aa5ba; --line: #283246; --grid: #1a2232;
  --accent: #86a6ff; --accent-ink: #0b1020; --accent-soft: #1d2743; --accent-2: #fb923c; --mark: #6b5713;
  --good: #5fd39a; --good-soft: #12301f; --bad: #ff8a80; --bad-soft: #3a1a18; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.topnav { display: flex; gap: 4px; flex-wrap: wrap; }
.topnav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 0.95rem; }
.topnav a:hover { background: var(--accent-soft); color: var(--ink); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 0.95rem; font-weight: 700; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.big { padding: 12px 18px; font-size: 1rem; }

/* hero */
.hero { background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; border-bottom: 1px solid var(--line); }
.hero-inner { padding-block: 40px 32px; display: grid; gap: 16px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(1.9rem, 4.6vw, 2.9rem); letter-spacing: -0.02em; max-width: 20ch; }
.lede { max-width: 60ch; color: var(--muted); font-size: 1.05rem; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 8px 0 0; }
.stats div { background: var(--card); padding: 12px 14px; }
.stats dt { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* topics on home */
.topic { margin-top: 36px; }
.topic-head { display: grid; gap: 4px; margin-bottom: 12px; }
.topic h2 { font-size: 1.4rem; }
.tcode { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; vertical-align: middle; margin-right: 6px; }
.lesson-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.lesson-list li + li { border-top: 1px solid var(--line); }
.lesson-row { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto 9rem; align-items: center; gap: 12px; padding: 12px 16px; color: var(--ink); text-decoration: none; }
.lesson-row:hover { background: var(--accent-soft); }
.lcode { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.lcode.big { font-size: 0.6em; vertical-align: middle; margin-right: 4px; }
.ltitle { display: grid; min-width: 0; }
.lsum { color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
.lsteps { display: flex; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.on { background: var(--accent); border-color: var(--accent); }
.lmeter { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: block; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar span { display: block; height: 100%; background: var(--good); border-radius: 3px; transition: width .3s ease; }
@media (max-width: 620px) {
  .lesson-row { grid-template-columns: 2.6rem minmax(0, 1fr); row-gap: 6px; }
  .lsteps { grid-column: 2; }
  .lmeter { grid-column: 2; }
}
.howto { margin: 40px 0 56px; padding: 20px; border: 1px dashed var(--line); border-radius: var(--radius); display: grid; gap: 10px; }
.howto h2 { font-size: 1.2rem; }
.howto ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

/* lesson */
.lesson, .formulas, .review { padding-block: 20px 60px; }
.crumb { font-size: 0.88rem; color: var(--muted); margin-bottom: 10px; }
.crumb a { color: var(--muted); }
.les-head { display: grid; gap: 10px; margin-bottom: 18px; }
.les-head h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); letter-spacing: -0.015em; }
.les-mastery { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem; max-width: 360px; }
.les-mastery .bar { flex: 1; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; text-decoration: none; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 700; font-size: 0.95rem; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tnum { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--grid); font-family: var(--font-mono); font-size: 0.75rem; }
.tab.active .tnum { background: var(--accent); color: var(--accent-ink); }
.tick { color: var(--good); }
.tab-body { display: grid; gap: 26px; }
h2.sec { font-size: 1.15rem; margin-bottom: 10px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.fcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; text-align: left; font: inherit; color: inherit; }
.fname { justify-self: start; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.01em; background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; }
.fmath { overflow-x: auto; overflow-y: hidden; min-width: 0; display: block; }
.fmath mjx-container[display="true"] { margin: 6px 0 !important; text-align: left !important; }
.fnote { font-size: 0.85rem; color: var(--muted); line-height: 1.45; }
.note { display: grid; gap: 10px; max-width: 70ch; }
.note p, .note li { line-height: 1.65; }
.note ul, .note ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
.two-col > div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.two-col ul { padding-left: 1.1em; }
.kbd { font-family: var(--font-mono); font-size: 0.82em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); }
.pitfalls { background: var(--bad-soft); border-radius: var(--radius); padding: 14px 18px; }
.pitfalls ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.next-step { display: flex; justify-content: flex-end; }
.table-wrap, .chart-wrap { overflow-x: auto; max-width: 100%; }
table.mini { border-collapse: collapse; font-size: 0.92rem; background: var(--card); }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
table.mini th { font-weight: 700; background: var(--grid); }
table.signchart { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.88rem; margin: 6px 0; background: var(--card); }
table.signchart th, table.signchart td { border: 1px solid var(--line); padding: 4px 10px; text-align: center; min-width: 2.2em; }
table.signchart th { background: var(--grid); }
table.signchart td.pt { background: var(--accent-soft); }
table.signchart td.pos { color: var(--good); font-weight: 600; }
table.signchart td.neg { color: var(--bad); font-weight: 600; }

/* explorer */
.explorer { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.explorer canvas { width: 100%; max-width: 100%; border-radius: 6px; display: block; }
.ex-ctrl { display: grid; gap: 10px; font-size: 0.92rem; }
.ex-ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
.ex-ctrl output { font-family: var(--font-mono); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--accent); }
.lg.log::before { background: var(--accent-2); }
.lg.mir::before { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px); }
.ex-read { font-size: 0.86rem; line-height: 1.45; }
@media (max-width: 620px) { .explorer { grid-template-columns: 1fr; } }

/* examples */
.intro { max-width: 65ch; }
.example { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.example h3 { font-size: 1.05rem; }
.exnum { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); display: block; margin-bottom: 2px; }
.ex-p { overflow-x: auto; }
.ex-steps { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.ex-steps li { padding-left: 4px; overflow-x: auto; }
.ex-steps li::marker { color: var(--accent); font-weight: 700; }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* practice */
.practice { display: grid; gap: 14px; }
.skillbar { display: flex; flex-wrap: wrap; gap: 6px; }
.skill { font: inherit; font-size: 0.85rem; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.skill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.sdot.good { background: var(--good); } .sdot.mid { background: #d9a400; } .sdot.low { background: var(--bad); }
.session-line { font-size: 0.88rem; color: var(--muted); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.prob { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.prob-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.chip { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
.prob-q { font-size: 1.08rem; overflow-x: auto; overflow-y: hidden; }
.prob-in { display: grid; gap: 6px; }
.ans-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ans-prompt { white-space: nowrap; }
.ans-input { font: inherit; font-family: var(--font-mono); font-size: 1rem; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); min-width: 0; flex: 1 1 200px; max-width: 340px; }
.ans-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ans-op { font: inherit; font-size: 1rem; padding: 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.ans-unit { color: var(--muted); font-size: 0.92rem; }
.ans-preview { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }
.ans-help { font-size: 0.8rem; color: var(--muted); }
.choices { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 10px; text-align: left; font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; min-width: 0; }
.choice:hover { border-color: var(--accent); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice-key { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--grid); font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; }
.choice-body { overflow-x: auto; overflow-y: hidden; }
.choice.is-right { border-color: var(--good); background: var(--good-soft); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.is-done .choice { cursor: default; }
.prob-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.feedback { padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback.info { background: var(--accent-soft); color: var(--ink); }
.feedback strong { font-weight: 700; }
.hint { padding: 10px 14px; border-left: 3px solid var(--mark); background: var(--paper); font-size: 0.95rem; }
.solution { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.solution h4 { margin: 0; font-family: var(--font-display); font-size: 1rem; }
.solution ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.solution li { overflow-x: auto; overflow-y: hidden; }
.sol-ans { font-size: 0.95rem; }
.course { display: grid; gap: 8px; }
.course ol { margin: 0; padding-left: 1.3em; display: grid; gap: 12px; }
.course details { margin-top: 4px; }
.course summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
.course-a { padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; overflow-x: auto; }
.les-pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.92rem; flex-wrap: wrap; }
.les-pager a { text-decoration: none; }

/* formula sheet */
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 0.95rem; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.fs-les { margin-top: 18px; }
.fs-les h3 { font-size: 1rem; margin-bottom: 8px; }
.fs-les h3 a { color: var(--ink); text-decoration: none; }
.fs-les h3 a:hover { color: var(--accent); }
.fcard.fs { cursor: default; }
.hidden-mode .fcard.fs { cursor: pointer; }
.hidden-mode .fcard.fs .fmath { filter: blur(7px); opacity: 0.5; transition: filter .2s, opacity .2s; }
.hidden-mode .fcard.fs.revealed .fmath { filter: none; opacity: 1; }

/* review */
.rv-dots { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.rv-dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.rv-dots span.cur { background: var(--accent); }
.rv-dots span.ok { background: var(--good); }
.rv-dots span.no { background: var(--bad); }
.rv-label { font-size: 0.88rem; margin-bottom: 10px; }
.summary { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 12px; }
.big-score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.per-les { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.per-les li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="#home">MB·A <span>Maths Trainer</span></a>
  <nav class="topnav" aria-label="Main"><a href="#home">Lessons</a><a href="#formulas">Formula sheet</a><a href="#review">Smart review</a></nav>
</div></header>
<main id="app"><div class="wrap" style="padding-block:40px"><p class="muted">Loading lessons…</p></div></main>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false },
  startup: { typeset: false, ready: function () { MathJax.startup.defaultReady(); MathJax.startup.promise.then(function () { if (window.MS && MS.mathReady) MS.mathReady(); }); } }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="app.js"></script>
<script src="content/topic1.js"></script>
<script src="content/topic2.js"></script>
<script>MS.start();</script>
</body>
</html>
